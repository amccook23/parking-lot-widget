<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Parking Lot</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Inter", -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 12px;
      color: #1e1e1e;
      background: #fff;
    }

    /* ── Add form ── */
    #add-form { padding: 16px; display: none; }

    .form-label {
      font-size: 10px;
      font-weight: 600;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 4px;
      display: block;
    }

    .form-row { margin-bottom: 12px; }

    .form-input {
      width: 100%;
      border: 1px solid #e0e0e0;
      border-radius: 6px;
      padding: 7px 9px;
      font-size: 12px;
      font-family: inherit;
      color: #1e1e1e;
      background: #fff;
      outline: none;
      transition: border-color 0.12s, box-shadow 0.12s;
    }

    .form-input::placeholder { color: #bbb; }
    .form-input:focus {
      border-color: #0d99ff;
      box-shadow: 0 0 0 2px rgba(13,153,255,0.12);
    }

    textarea.form-input { resize: none; height: 60px; line-height: 1.5; }

    .form-actions {
      display: flex;
      gap: 8px;
      justify-content: flex-end;
      margin-top: 16px;
    }

    .btn {
      padding: 6px 14px;
      font-size: 11px;
      font-weight: 500;
      border-radius: 6px;
      cursor: pointer;
      font-family: inherit;
      transition: background 0.12s;
    }

    .btn-secondary { border: 1px solid #ddd; background: #fff; color: #555; }
    .btn-secondary:hover { background: #f5f5f5; }
    .btn-primary { border: none; background: #1e1e1e; color: #fff; }
    .btn-primary:hover { background: #333; }
    .btn-primary:disabled { background: #ccc; cursor: not-allowed; }

    /* ── Status picker ── */
    #status-picker { display: none; }

    .status-option {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 16px;
      cursor: pointer;
      transition: background 0.1s;
      border-bottom: 1px solid #f0f0f0;
    }

    .status-option:last-child { border-bottom: none; }
    .status-option:hover { background: #f7f7f7; }

    .status-option.active { background: #f0f7ff; }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .status-label {
      font-size: 12px;
      font-weight: 500;
      color: #1e1e1e;
    }

    .status-check {
      margin-left: auto;
      font-size: 12px;
      color: #0d99ff;
    }
  </style>
</head>
<body>

  <!-- Add item form -->
  <div id="add-form">
    <div class="form-row">
      <label class="form-label">Item *</label>
      <input id="input-title" class="form-input" type="text" placeholder="What's being parked?" maxlength="120" autocomplete="off">
    </div>
    <div class="form-row">
      <label class="form-label">Details</label>
      <textarea id="input-desc" class="form-input" placeholder="Any context or notes…"></textarea>
    </div>
    <div class="form-row">
      <label class="form-label">Owner</label>
      <input id="input-owner" class="form-input" type="text" placeholder="Who owns this?" maxlength="60" autocomplete="off">
    </div>
    <div class="form-actions">
      <button class="btn btn-secondary" id="btn-cancel">Cancel</button>
      <button class="btn btn-primary" id="btn-save" disabled>Add item</button>
    </div>
  </div>

  <!-- Status picker -->
  <div id="status-picker">
    <div class="status-option" data-status="parked">
      <div class="status-dot" style="background:#7A5500;"></div>
      <span class="status-label">Parked</span>
      <span class="status-check" id="check-parked"></span>
    </div>
    <div class="status-option" data-status="revisiting">
      <div class="status-dot" style="background:#1D4ED8;"></div>
      <span class="status-label">Revisiting</span>
      <span class="status-check" id="check-revisiting"></span>
    </div>
    <div class="status-option" data-status="resolved">
      <div class="status-dot" style="background:#065F46;"></div>
      <span class="status-label">Resolved</span>
      <span class="status-check" id="check-resolved"></span>
    </div>
  </div>

  <script>
    var mode = null;

    // ── Add form logic ──
    var inputTitle = document.getElementById("input-title");
    var inputDesc  = document.getElementById("input-desc");
    var inputOwner = document.getElementById("input-owner");
    var btnSave    = document.getElementById("btn-save");
    var btnCancel  = document.getElementById("btn-cancel");

    inputTitle.addEventListener("input", function () {
      btnSave.disabled = inputTitle.value.trim() === "";
    });

    inputTitle.addEventListener("keydown", function (e) {
      if (e.key === "Enter" && !btnSave.disabled) btnSave.click();
    });

    btnSave.addEventListener("click", function () {
      var title = inputTitle.value.trim();
      if (!title) return;
      parent.postMessage({ pluginMessage: {
        type: "add",
        title: title,
        description: inputDesc.value.trim(),
        owner: inputOwner.value.trim(),
      }}, "*");
    });

    btnCancel.addEventListener("click", function () {
      parent.postMessage({ pluginMessage: { type: "cancel" } }, "*");
    });

    // ── Status picker logic ──
    document.querySelectorAll(".status-option").forEach(function (el) {
      el.addEventListener("click", function () {
        parent.postMessage({ pluginMessage: {
          type: "set-status",
          status: el.dataset.status,
        }}, "*");
      });
    });

    // ── Message from widget ──
    window.onmessage = function (event) {
      var msg = event.data.pluginMessage;
      if (!msg) return;

      if (msg.type === "status-picker") {
        document.getElementById("status-picker").style.display = "block";
        // Mark current status
        var check = document.getElementById("check-" + msg.currentStatus);
        if (check) check.textContent = "✓";
        var active = document.querySelector('[data-status="' + msg.currentStatus + '"]');
        if (active) active.classList.add("active");

      } else if (msg.type === "add-form") {
        document.getElementById("add-form").style.display = "block";
        inputTitle.focus();
      }
    };
  </script>
</body>
</html>
